<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mirante · Tour 3D de exemplo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-bleed 3D stage; floating drawing-sheet panels (title block, legend chips, plan minimap) */
:root{
  --sheet: rgba(251,250,247,.9);
  --sheet-solid:#fbfaf7;
  --ink:#1b1f24;
  --ink-2:#5b6068;
  --rule:rgba(27,31,36,.14);
  --accent:#1F6F86;      /* azul "a construir" da prancha */
  --accent-ink:#ffffff;
  --stage:#e7e3dc;
  --f-display:"Michroma","Eurostile","Arial Narrow",sans-serif;
  --f-ui:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme: light;
}
html,body{height:100%;overflow:hidden}
body{background:var(--stage);color:var(--ink);font-family:var(--f-ui);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%;outline:none;cursor:grab}
#stage canvas:active{cursor:grabbing}
.ui{position:fixed;z-index:5}
.panel{background:var(--sheet);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid var(--rule);border-radius:10px;box-shadow:0 6px 24px rgba(20,22,28,.12)}

#top{left:0;right:0;top:0;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;
  padding-top:calc(12px + env(safe-area-inset-top,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
#top>*{pointer-events:auto}
.title{padding:10px 14px 11px;min-width:0}
.title h1{margin:0;font:400 15px/1.15 var(--f-display);letter-spacing:.14em;text-transform:uppercase;text-wrap:balance}
.title p{margin:5px 0 0;font-size:12.5px;color:var(--ink-2);line-height:1.35}
.title .code{font-variant-numeric:tabular-nums;letter-spacing:.04em}

.seg{display:flex;padding:4px;gap:4px;flex:none}
.seg button{appearance:none;border:0;background:transparent;color:var(--ink);font:600 13px/1 var(--f-ui);padding:10px 14px;border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:focus-visible,.chip:focus-visible,#info button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#mapBox{right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:300px;padding:8px 8px 6px}
#map{display:block;width:100%;aspect-ratio:2.05/1;max-width:100%;cursor:crosshair;border-radius:6px;background:#f4f2ed}
.maplbl{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-2);padding:6px 2px 0;letter-spacing:.02em}
.maplbl b{font-weight:600;color:var(--ink);text-transform:uppercase;letter-spacing:.08em;font-size:10.5px}

#rooms{left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));right:calc(max(16px,env(safe-area-inset-right,0px)) + 316px);
  display:flex;flex-direction:column;gap:6px;padding:10px 10px 10px}
#rooms .lbl{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);padding:0 2px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chip{flex:none;appearance:none;border:1px solid var(--rule);background:var(--sheet-solid);color:var(--ink);border-radius:999px;padding:7px 11px 7px 12px;font:500 13px/1 var(--f-ui);cursor:pointer;display:flex;gap:7px;align-items:baseline;white-space:nowrap}
.chip small{font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.chip[aria-current="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.chip[aria-current="true"] small{color:rgba(255,255,255,.8)}

#hint{left:50%;transform:translateX(-50%);top:calc(84px + env(safe-area-inset-top,0px));font-size:12.5px;padding:8px 13px;border-radius:999px;background:rgba(27,31,36,.72);color:#fff;white-space:nowrap;pointer-events:none;transition:opacity .5s}
#hint.off{opacity:0}

#info{left:max(16px,env(safe-area-inset-left,0px));top:calc(96px + env(safe-area-inset-top,0px));width:min(320px,calc(100% - 32px));padding:14px 16px 14px}
#info .k{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
#info h2{margin:4px 0 6px;font-size:18px;line-height:1.2;font-weight:700;text-wrap:balance}
#info p{margin:0;font-size:13.5px;line-height:1.45;color:var(--ink-2)}
#info .dims{margin-top:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-variant-numeric:tabular-nums}
#info .dims div{border-top:1px solid var(--rule);padding-top:6px}
#info .dims span{display:block;font-size:10.5px;color:var(--ink-2);letter-spacing:.06em;text-transform:uppercase}
#info .dims b{font-size:15px;font-weight:600}
#info button{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:8px;border:0;background:transparent;font-size:20px;line-height:1;color:var(--ink-2);cursor:pointer}

#joy{left:max(22px,calc(env(safe-area-inset-left,0px) + 22px));bottom:calc(150px + env(safe-area-inset-bottom,0px));width:112px;height:112px;border-radius:50%;background:rgba(251,250,247,.35);border:1.5px solid rgba(255,255,255,.75);box-shadow:0 4px 18px rgba(0,0,0,.18);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(251,250,247,.95);box-shadow:0 2px 8px rgba(0,0,0,.25)}

#loader{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:var(--stage);transition:opacity .6s}
#loader.done{opacity:0;pointer-events:none}
#loader div{text-align:center}
#loader h1{font:400 16px/1.2 var(--f-display);letter-spacing:.16em;margin:0 0 10px}
#loader p{margin:0;color:var(--ink-2);font-size:13px}
#loader i{display:block;margin:16px auto 0;width:140px;height:2px;background:var(--rule);position:relative;overflow:hidden}
#loader i::after{content:"";position:absolute;inset:0;width:40%;background:var(--accent);animation:ld 1.1s ease-in-out infinite}
@keyframes ld{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
#note{right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:11px;color:var(--ink-2);display:none}

/* incorporado no app: o app mostra título e cômodos */
.embed #top,.embed #rooms{display:none}
.embed #hint{top:calc(64px + env(safe-area-inset-top,0px))}
.embed #info{top:calc(64px + env(safe-area-inset-top,0px))}
.embed #mapBox{top:auto}
.embed #mapBox{bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media (max-width:760px){
  #mapBox{top:calc(76px + env(safe-area-inset-top,0px));bottom:auto;width:176px;padding:5px 5px 3px}
  .maplbl{font-size:10px}.maplbl span{display:none}
  #rooms{right:max(16px,env(safe-area-inset-right,0px));padding:8px}
  #rooms .lbl{display:none}
  .title{padding:8px 11px 9px}
  .title h1{font-size:12.5px}
  .title p{font-size:11.5px}
  .title p .addr{display:none}
  .seg button{padding:9px 10px;font-size:12.5px}
  #hint{top:auto;bottom:calc(80px + env(safe-area-inset-bottom,0px));font-size:12px;white-space:normal;width:max-content;max-width:calc(100% - 32px);text-align:center}
  #info{top:auto;bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  #joy{bottom:calc(128px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){#loader i::after{animation:none}}
</style>
</head>
<body>


<div id="stage"></div>

<header id="top" class="ui">
  <div class="panel title">
    <h1>Apartamento</h1>
    <p>Salvador <span class="addr">· 2 suítes</span> · <span class="code">112 m² úteis</span><br>Tour 3D de exemplo · Mirante</p>
  </div>
  <div class="panel seg" role="group" aria-label="Modo de visualização">
    <button id="bAerial" aria-pressed="true">Maquete</button>
    <button id="bWalk" aria-pressed="false">Por dentro</button>
  </div>
</header>

<div id="hint" class="ui">Arraste para girar · toque num cômodo para entrar</div>

<section id="info" class="ui panel" hidden aria-live="polite">

  <div class="k" id="infoRoom">Móvel</div>
  <h2 id="infoName"></h2>

  <div class="dims">

  </div>
</section>

<nav id="rooms" class="ui panel" aria-label="Cômodos">
  <div class="lbl">Ir para o cômodo</div>
  <div class="chips" id="chips"></div>
</nav>

<aside id="mapBox" class="ui panel">

<div id="joy" class="ui" hidden><div id="knob"></div></div>

/* ---------- construtores básicos ---------- */
function mesh(p,geo,mat,x,y,z){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;p.add(m);return m;}
function rbox(w,h,d,r){r=Math.min(r,w/2-1e-3,h/2-1e-3,d/2-1e-3);return r>0.002?new THREE.RoundedBoxGeometry(w,h,d,3,r):new THREE.BoxGeometry(w,h,d);}
function bx(p,mat,x0,y0,z0,x1,y1,z1,r){const w=Math.abs(x1-x0),h=Math.abs(y1-y0),d=Math.abs(z1-z0);return mesh(p,r?rbox(w,h,d,r):new THREE.BoxGeometry(w,h,d),mat,(x0+x1)/2,(y0+y1)/2,(z0+z1)/2);}
function bc(p,mat,cx,cy,cz,w,h,d,r){return mesh(p,r?rbox(w,h,d,r):new THREE.BoxGeometry(w,h,d),mat,cx,cy,cz);}
function cyl(p,mat,cx,y0,cz,rt,rb,h,seg){return mesh(p,new THREE.CylinderGeometry(rt,rb,h,seg||24),mat,cx,y0+h/2,cz);}
function sph(p,mat,cx,cy,cz,sx,sy,sz,seg){const m=mesh(p,new THREE.SphereGeometry(1,seg||20,Math.max(8,(seg||20)*0.6|0)),mat,cx,cy,cz);m.scale.set(sx,sy,sz);return m;}
function lathe(p,mat,cx,y0,cz,pts,seg){const g=new THREE.LatheGeometry(pts.map(q=>new THREE.Vector2(q[0],q[1])),seg||32);return mesh(p,g,mat,cx,y0,cz);}
function planeW(w,h,u0,v0){const g=new THREE.PlaneGeometry(w,h);const uv=g.attributes.uv;for(let i=0;i<uv.count;i++)uv.setXY(i,(u0||0)+uv.getX(i)*w,(v0||0)+uv.getY(i)*h);return g;}

function place(g,x,z,rot,y){g.position.set(x,y||0,z);g.rotation.y=rot||0;scene.add(g);items.push(g);g.updateMatrixWorld(true);
  const o=g.userData.item?g.userData.item.opts:{};const b=new THREE.Box3().setFromObject(g);

    sm.rotation.x=-Math.PI/2;sm.scale.set(sw*1.25,sd*1.25,1);sm.position.set((b.min.x+b.max.x)/2,(b.min.y>0.05?0.0:b.min.y)+0.016,(b.min.z+b.max.z)/2);sm.renderOrder=1;scene.add(sm);}

  return g;}

document.getElementById('bAerial').addEventListener('click',()=>{if(mode!=='aerial')toAerial();});
document.getElementById('bWalk').addEventListener('click',()=>{if(mode==='aerial')goRoom(ROOMS[0]);});

/* colisão */
function inPoly(x,z,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const xi=p[i][0],zi=p[i][1],xj=p[j][0],zj=p[j][1];if(((zi>z)!==(zj>z))&&(x<(xj-xi)*(z-zi)/(zj-zi)+xi))c=!c;}return c;}
const WALK_RECTS=FLOORS.map(f=>f[0]);
function onFloor(x,z){for(const r of WALK_RECTS)if(x>=r[0]&&x<=r[2]&&z>=r[1]&&z<=r[3])return true;return inPoly(x,z,BAL_FLOOR);}
const SOLIDS=[...WALLS,...WINDOWS.map(w=>[[w[0],w[1]],[w[2],w[1]],[w[2],w[3]],[w[0],w[3]]]),[...BAL_OUT,...BAL_IN.slice().reverse()]];
function free(x,z){if(!onFloor(x,z))return false;const rr=0.16;for(let k=0;k<9;k++){const a=k/8*6.283,px=k===8?x:x+Math.cos(a)*rr,pz=k===8?z:z+Math.sin(a)*rr;for(const p of SOLIDS)if(inPoly(px,pz,p))return false;}
  for(const b of blockers)if(x>b[0]-0.14&&x<b[2]+0.14&&z>b[1]-0.14&&z<b[3]+0.14)return false;return true;}
function tryMove(dx,dz){const p=camera.position;if(free(p.x+dx,p.z+dz)){p.x+=dx;p.z+=dz;}else if(free(p.x+dx,p.z)){p.x+=dx;}else if(free(p.x,p.z+dz)){p.z+=dz;}}
let walkAnim=null;
function walkTo(x,z){const p=camera.position;let tx=p.x,tz=p.z;const dx=x-p.x,dz=z-p.z,L=Math.hypot(dx,dz);const steps=Math.ceil(L/0.05);
  for(let i=1;i<=steps;i++){const nx=p.x+dx*i/steps,nz=p.z+dz*i/steps;if(!free(nx,nz))break;tx=nx;tz=nz;}
  if(Math.hypot(tx-p.x,tz-p.z)<0.05)return;walkAnim={x0:p.x,z0:p.z,x1:tx,z1:tz,t:0,dur:Math.max(0.35,Math.hypot(tx-p.x,tz-p.z)/1.9)};}

/* entrada: ponteiro, toque, teclado, joystick */
const keys={};addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter'))return;keys[e.key.toLowerCase()]=true;});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
const cv=renderer.domElement;let drag=null;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,t:performance.now(),id:e.pointerId};if(mode==='walk')cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;if(mode==='walk'){const k=isTouch?0.0055:0.0038;yaw+=(e.clientX-drag.x)*k;pitch+=(e.clientY-drag.y)*k;pitch=Math.max(-1.25,Math.min(1.25,pitch));walkAnim=null;}drag.x=e.clientX;drag.y=e.clientY;});
cv.addEventListener('pointerup',e=>{if(!drag)return;const moved=Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0),dt=performance.now()-drag.t;drag=null;if(moved<7&&dt<450)tap(e);});
cv.addEventListener('pointercancel',()=>{drag=null;});
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function findItem(o){while(o){if(o.userData&&o.userData.item)return o;o=o.parent;}return null;}
function tap(e){if(mode!=='aerial'&&mode!=='walk')return;const r=cv.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects(pickables,false).filter(h=>h.object.visible&&h.object.material!==C.glass&&h.object.material!==C.curtain);if(!hits.length){hideInfo();return;}
  const h=hits[0];const it=findItem(h.object);
  if(it){showInfo(it);return;}
  if(h.object.userData.floor){hideInfo();if(mode==='walk')walkTo(h.point.x,h.point.z);else{const d=new V3(h.point.x-camera.position.x,0,h.point.z-camera.position.z).normalize();const p=[h.point.x,h.point.z];let q=p;if(!free(p[0],p[1])){for(let rr=0.1;rr<1.2;rr+=0.1){let ok=false;for(let a=0;a<6.28;a+=0.4){if(free(p[0]+Math.cos(a)*rr,p[1]+Math.sin(a)*rr)){q=[p[0]+Math.cos(a)*rr,p[1]+Math.sin(a)*rr];ok=true;break;}}if(ok)break;}}
    setChip('');enterWalk(q,[q[0]+d.x*3,q[1]+d.z*3]);}}
  else hideInfo();}
/* joystick */
const joy=document.getElementById('joy'),knob=document.getElementById('knob');let jv={x:0,y:0},jid=null;
function joyMove(e){const r=joy.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);const m=r.width/2-12,L=Math.hypot(dx,dy);if(L>m){dx*=m/L;dy*=m/L;}knob.style.transform=`translate(${dx}px,${dy}px)`;jv={x:dx/m,y:dy/m};}
joy.addEventListener('pointerdown',e=>{jid=e.pointerId;joy.setPointerCapture(e.pointerId);joyMove(e);e.stopPropagation();});
joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)joyMove(e);});
const joyEnd=e=>{if(e.pointerId!==jid)return;jid=null;jv={x:0,y:0};knob.style.transform='';};joy.addEventListener('pointerup',joyEnd);joy.addEventListener('pointercancel',joyEnd);

/* painel de informações */
const infoEl=document.getElementById('info');let selBox=null;
const fmt=v=>v.toFixed(2).replace('.',',')+' m';
function showInfo(it){const d=it.userData.item;document.getElementById('infoRoom').textContent=d.room||'Esquadria';document.getElementById('infoName').textContent=d.name;document.getElementById('infoDesc').textContent=d.desc;
  const rot=Math.abs(Math.sin(it.rotation.y))>0.7;document.getElementById('dW').textContent=fmt(d.w);document.getElementById('dD').textContent=fmt(d.d);document.getElementById('dH').textContent=fmt(d.h);infoEl.hidden=false;
  if(selBox){scene.remove(selBox);}const b=new THREE.Box3().setFromObject(it);b.expandByScalar(0.015);selBox=new THREE.Box3Helper(b,new THREE.Color('#1F6F86'));selBox.material.depthTest=false;selBox.renderOrder=10;scene.add(selBox);}
function hideInfo(){infoEl.hidden=true;if(selBox){scene.remove(selBox);selBox=null;}}
document.getElementById('infoClose').addEventListener('click',hideInfo);

/* dica */
const hintEl=document.getElementById('hint');let hintT=0;function showHint(t){hintEl.textContent=t;hintEl.classList.remove('off');clearTimeout(hintT);hintT=setTimeout(()=>hintEl.classList.add('off'),6500);}

/* ---------- minimapa (planta) ---------- */
const mapC=document.getElementById('map'),mctx=mapC.getContext('2d');const MB={x0:-0.3,z0:-0.1,x1:20.9,z1:10.65};let mapScale=1,mapOff=[0,0];
function sizeMap(){const r=mapC.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);mapC.width=Math.round(r.width*dpr);mapC.height=Math.round(r.height*dpr);mapScale=Math.min(mapC.width/(MB.x1-MB.x0),mapC.height/(MB.z1-MB.z0));mapOff=[(mapC.width-(MB.x1-MB.x0)*mapScale)/2-MB.x0*mapScale,(mapC.height-(MB.z1-MB.z0)*mapScale)/2-MB.z0*mapScale];}
const mp=(x,z)=>[x*mapScale+mapOff[0],z*mapScale+mapOff[1]];
function drawMap(){const c=mctx;c.clearRect(0,0,mapC.width,mapC.height);c.fillStyle='#fffdf9';for(const r of WALK_RECTS){const a=mp(r[0],r[1]),b=mp(r[2],r[3]);c.fillRect(a[0],a[1],b[0]-a[0],b[1]-a[1]);}
  c.beginPath();BAL_FLOOR.forEach((p,i)=>{const q=mp(p[0],p[1]);i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]);});c.fill();
  c.fillStyle='rgba(31,111,134,0.10)';for(const b of blockers){const a=mp(b[0],b[1]),e=mp(b[2],b[3]);c.fillRect(a[0],a[1],e[0]-a[0],e[1]-a[1]);}
  c.fillStyle='#24272b';for(const p of [...WALLS,[...BAL_OUT,...BAL_IN.slice().reverse()]]){c.beginPath();p.forEach((q,i)=>{const s=mp(q[0],q[1]);i?c.lineTo(s[0],s[1]):c.moveTo(s[0],s[1]);});c.closePath();c.fill();}
  c.strokeStyle='#7aa0c0';c.lineWidth=Math.max(1,mapScale*0.05);for(const w of WINDOWS){const a=mp(w[0],w[1]),b=mp(w[2],w[3]);c.strokeRect(a[0],a[1],b[0]-a[0],b[1]-a[1]);}
  const p=camera.position;let cx,cz,ang;if(mode==='aerial'||mode==='flying'){cx=controls.target.x;cz=controls.target.z;const d=new V3().subVectors(controls.target,camera.position);ang=Math.atan2(d.z,d.x);}else{cx=p.x;cz=p.z;ang=Math.atan2(-Math.cos(yaw),-Math.sin(yaw));}
  const s=mp(cx,cz),R0=mapScale*1.6;c.fillStyle='rgba(31,111,134,0.22)';c.beginPath();c.moveTo(s[0],s[1]);c.arc(s[0],s[1],R0,ang-0.55,ang+0.55);c.closePath();c.fill();
  c.fillStyle='#1F6F86';c.strokeStyle='#fff';c.lineWidth=Math.max(1.5,mapScale*0.08);c.beginPath();c.arc(s[0],s[1],Math.max(4,mapScale*0.22),0,7);c.fill();c.stroke();}
mapC.addEventListener('click',e=>{const r=mapC.getBoundingClientRect(),dpr=mapC.width/r.width;const x=((e.clientX-r.left)*dpr-mapOff[0])/mapScale,z=((e.clientY-r.top)*dpr-mapOff[1])/mapScale;
  let q=null;if(free(x,z))q=[x,z];else{for(let rr=0.1;rr<1.5&&!q;rr+=0.1)for(let a=0;a<6.28;a+=0.4){if(free(x+Math.cos(a)*rr,z+Math.sin(a)*rr)){q=[x+Math.cos(a)*rr,z+Math.sin(a)*rr];break;}}}
  if(!q)return;hideInfo();setChip('');const lx=q[0]+(CENTER.x-q[0])*0.3,lz=q[1]+(CENTER.z-q[1])*0.3;if(mode==='walk'){const d=[-Math.sin(yaw),-Math.cos(yaw)];enterWalk(q,[q[0]+d[0]*3,q[1]+d[1]*3]);}else enterWalk(q,[lx===q[0]?q[0]+1:lx,lz]);});

/* ---------- laço ---------- */
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;if(mode!=='aerial'&&mode!=='flying')camera.fov=camera.aspect<1?82:70;camera.updateProjectionMatrix();sizeMap();}
addEventListener('resize',resize);
const clock=new THREE.Clock();let mapTick=0;
function loop(){const dt=Math.min(0.05,clock.getDelta());
  if(tween){tween.t+=dt/tween.dur;const k=ease(Math.min(1,tween.t));camera.position.lerpVectors(tween.p0,tween.p1,k);lookPt.lerpVectors(tween.l0,tween.l1,k);camera.lookAt(lookPt);if(tween.t>=1){const d=tween.done;tween=null;d&&d();}}
  else if(mode==='aerial'){controls.update();lookPt.copy(controls.target);}
  else if(mode==='walk'){
    let f=0,s=0,turn=0;if(keys['w']||keys['arrowup'])f+=1;if(keys['s']||keys['arrowdown'])f-=1;if(keys['a'])s-=1;if(keys['d'])s+=1;if(keys['arrowleft']||keys['q'])turn+=1;if(keys['arrowright']||keys['e'])turn-=1;
    f-=jv.y;s+=jv.x;yaw+=turn*dt*1.6;
    if(f||s){walkAnim=null;const sp=1.7*dt;const fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);tryMove((fx*f+rx*s)*sp,(fz*f+rz*s)*sp);}
    if(walkAnim){walkAnim.t+=dt/walkAnim.dur;const k=ease(Math.min(1,walkAnim.t));camera.position.x=walkAnim.x0+(walkAnim.x1-walkAnim.x0)*k;camera.position.z=walkAnim.z0+(walkAnim.z1-walkAnim.z0)*k;if(walkAnim.t>=1)walkAnim=null;}
    camera.position.y=EYE;camera.rotation.order='YXZ';camera.rotation.set(pitch,yaw,0);lookPt.set(camera.position.x-Math.sin(yaw)*3,EYE+Math.sin(pitch)*3,camera.position.z-Math.cos(yaw)*3);}
  {const inside=mode!=='aerial'&&camera.position.y<3.2;if(sky.visible!==inside){sky.visible=ground.visible=inside;scene.background=inside?SKYBG:BG_AERIAL;}}
  renderer.render(scene,camera);if(++mapTick%3===0)drawMap();requestAnimationFrame(loop);}
setMode('aerial');sizeMap();resize();
renderer.compile(scene,camera);
requestAnimationFrame(()=>{loop();setTimeout(()=>document.getElementById('loader').classList.add('done'),250);});
addEventListener('message',e=>{const d=e.data||{};if(d.source!=='mirante-app')return;if(d.type==='goRoom'){const r=ROOMS.find(x=>x.id===d.id);if(r)goRoom(r);}else if(d.type==='aerial'){if(mode!=='aerial')toAerial();}else if(d.type==='walk'){if(mode==='aerial')goRoom(ROOMS[0]);}});
tell({type:'ready'});
window.__tour={goRoom:id=>goRoom(ROOMS.find(r=>r.id===id)),toAerial,ROOMS,setView:(p,l)=>{enterWalk(p,l);},camera,scene};
})();
</script>
